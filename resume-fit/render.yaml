# Free demo: no persistent disk, real payments disabled, AI off by default.
# Blueprint path: resume-fit/render.yaml
services:
  - type: web
    name: resume-fit-free
    runtime: docker
    plan: free
    numInstances: 1
    rootDir: resume-fit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: SESSION_SECRET
        generateValue: true
      - key: FREE_HOSTING_DEMO
        value: 'true'
      - key: MAX_AI_REQUESTS_PER_DAY
        value: '0'
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
